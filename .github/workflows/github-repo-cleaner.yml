# 打包 gsoft/clean_repos.py 为 Windows exe（PyInstaller）
# 注意：这是你仓库里现在用的那个文件，名字是 github-repo-cleaner.yml，
# 不是 gsoft-exe.yml——覆盖的时候别传错文件名。
# 已修好：
#  1. 打包命令是 gsoft/clean_repos.py（脚本在 gsoft/ 子目录）
#  2. 手动跑也发 Release，主页右边“发行版”能看到；
#     以前那句 if: startsWith(github.ref, 'refs/tags/') 只在打 tag 时才发，
#     手动跑只出 Artifacts，所以主页一直是空的。
#  3. 版本号不再写死：从 gsoft/clean_repos.py 里自动读 VERSION
#     （比如 v2.0），每次改代码升版本，重跑打包就发对应版本号的新 Release。
#  4. Release 里放压缩包 github-repo-cleaner-windows.zip（不是单个 exe），
#     下载后解压就能用；Actions 里不再上传附件，打包文件只放发行版，
#     代码改了旧包就过时了，不再显示和上传。
#  5. 每个程序各保留最新 2 个版本：按发行版里的附件文件名分组，
#     DjMihomo.fpk 算 DjMihomo，github-repo-cleaner-windows.zip 算
#     github-repo-cleaner，其他附件按自己的文件名各成一组；每组只留
#     最新 2 个，第 3 个及更旧的删掉（连 tag 一起删）。
#     注意：不是全仓库总共只留 2 个——DjMihomo 留 2 个，cleaner 也留
#     2 个，互不挤占。一个发行版里同时挂了两个程序的附件时，它在两
#     组里都算数，只有在它所属的每一组都掉出前 2 名时才删。
# 用法：把这个文件覆盖到仓库的 .github/workflows/github-repo-cleaner.yml，
# 同时把 clean_repos.py 传到 gsoft/clean_repos.py、icon.ico 传到 gsoft/icon.ico，
# 然后去 Actions 页 → Build github-repo-cleaner.exe → Run workflow 手动跑一次，
# 跑完回主页看，发行版里会出现对应版本号，点进去下 zip 解压就能用。
# v2.1：打包加 --icon gsoft/icon.ico，exe 有图标了；图标文件在 gsoft/icon.ico，
# 没传图标打包会直接报错停下，不会悄悄打出一个没图标的 exe。
name: Build github-repo-cleaner.exe

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyInstaller
        run: pip install pyinstaller
      - name: 读版本号（从 clean_repos.py 的 VERSION 里读）
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path gsoft/clean_repos.py -Pattern 'VERSION = "v([0-9.]+)"' | Select-Object -First 1
          $ver = "v" + $line.Matches.Groups[1].Value
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "版本号：$ver"
      - name: 检查图标文件在不在
        shell: pwsh
        run: |
          if (-not (Test-Path gsoft/icon.ico)) { echo "缺图标文件：gsoft/icon.ico 没传上来，先传图标再打包"; exit 1 }
          echo "图标在：gsoft/icon.ico"
      - name: 打包成单个 exe（带图标）
        run: pyinstaller --onefile --console --name github-repo-cleaner --icon gsoft/icon.ico gsoft/clean_repos.py
      - name: 打成压缩包（Release 里放 zip，下载解压就能用）
        shell: pwsh
        run: Compress-Archive -Path dist/github-repo-cleaner.exe -DestinationPath dist/github-repo-cleaner-windows.zip -Force
      - name: 发到 Release（手动跑也发，主页能看到）
        # 打 tag 时用 tag 名，否则用脚本里的版本号；重复跑会更新同一个 Release，不会重复建
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.version }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: dist/github-repo-cleaner-windows.zip
      - name: 每个程序各保留最新 2 个版本（多的删掉）
        # 按附件文件名分组，不按全仓库总数删。Windows runner 上已有
        # Python（前面 setup-python 装的 3.12），用 shell: python 跑，
        # 这样本地也能用假 gh 数据实测同一段逻辑。
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import json, subprocess, sys

          KEEP = 2

          def gh(*args):
              r = subprocess.run(["gh"] + list(args), capture_output=True, text=True)
              return r

          def app_of(asset_name):
              n = asset_name.lower()
              if n.startswith("djmihomo"):
                  return "DjMihomo"
              if "github-repo-cleaner" in n:
                  return "github-repo-cleaner"
              return n  # 其他程序：按自己的附件文件名各成一组

          r = gh("release", "list", "--limit", "100", "--json", "tagName,createdAt")
          if r.returncode != 0:
              print("列发行版失败：", r.stderr.strip())
              sys.exit(1)
          releases = json.loads(r.stdout or "[]")
          if not releases:
              print("没有发行版，不用删")
              sys.exit(0)

          # 每个发行版属于哪些程序组（按它挂的附件算）
          groups = {}   # app -> [(createdAt, tag)]
          no_asset = []
          for rel in releases:
              tag = rel["tagName"]
              v = gh("release", "view", tag, "--json", "assets")
              assets = []
              if v.returncode == 0:
                  assets = [a.get("name", "") for a in json.loads(v.stdout or "{}").get("assets", [])]
              apps = sorted({app_of(a) for a in assets if a})
              if not apps:
                  no_asset.append(tag)
                  continue
              for app in apps:
                  groups.setdefault(app, []).append((rel["createdAt"], tag))

          keep = set()
          for app in sorted(groups):
              items = sorted(groups[app], reverse=True)  # 最新在前
              print(f"[{app}] 共 {len(items)} 个，保留最新 {KEEP} 个：{[t for _, t in items[:KEEP]]}")
              keep.update(t for _, t in items[:KEEP])

          if no_asset:
              print("无附件的发行版不自动删（只挂源码的）：", no_asset)
              keep.update(no_asset)

          to_delete = [rel["tagName"] for rel in releases if rel["tagName"] not in keep]
          if not to_delete:
              print("不用删")
              sys.exit(0)
          for tag in to_delete:
              print(f"删除旧发行版：{tag}")
              d = gh("release", "delete", tag, "--yes", "--cleanup-tag")
              if d.returncode != 0:
                  print(f"  [失败] {tag}：{d.stderr.strip()}")
          print(f"删完。保留：{sorted(keep)}")
